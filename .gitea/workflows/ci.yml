name: Gitea CI
# Gitea-native CI. Runner labels: self-hosted,linux,docker.
# Clones over the internal gitea:3000 hostname (no LAN IP in this file).
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
jobs:
  ci:
    runs-on: self-hosted
    container:
      image: rust:latest
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 "http://guan:${{ github.token }}@gitea:3000/guan/mcp-websearch.git" .repo
      - name: Add rustfmt
        working-directory: .repo
        run: rustup component add rustfmt
      - name: Format check
        working-directory: .repo
        run: cargo fmt --check
      - name: Add clippy + rustfmt
        working-directory: .repo
        run: rustup component add clippy rustfmt
      - name: Clippy
        working-directory: .repo
        run: cargo clippy -- -D warnings
      - name: Test
        working-directory: .repo
        run: cargo test
