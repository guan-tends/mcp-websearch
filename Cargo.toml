[package]
name = "mcp-websearch"
version = "1.0.0"
edition = "2024"
authors = ["Freeman & Guan"]
description = "MCP WebSearch server - DuckDuckGo Lite scraping tool"
license = "MIT"
repository = "https://github.com/freeman/mcp-websearch"
rust-version = "1.75"

[[bin]]
name = "mcp-websearch"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "0.16", features = ["server", "macros"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# HTML parsing (regex-based, per spec)
regex = "1"

# URL encoding/decoding
percent-encoding = "2"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging (to stderr for stdio mode)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1"
