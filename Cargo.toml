[package]
name = "mcp-websearch"
version = "1.0.0"
edition = "2024"
authors = ["David Newman & Guan"]
description = "MCP WebSearch server — DuckDuckGo Lite search tool for the Model Context Protocol"
license = "MIT"
repository = "https://github.com/guan-tends/mcp-websearch"
rust-version = "1.85"

[lib]
name = "mcp_websearch"
path = "src/lib.rs"

[[bin]]
name = "mcp-websearch"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-worker"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (rustls = pure Rust TLS, no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTML parsing (regex-based, per spec)
regex = "1"

# URL encoding/decoding
percent-encoding = "2"
url = "2"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging (to stderr for stdio mode)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1"
tempfile = "3"
